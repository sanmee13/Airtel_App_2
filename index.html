<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOS Intelligence — ASC Workways</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1117;--ink2:#1e2230;--ink3:#2d3348;--paper:#f5f4f0;--paper2:#ede9e0;--border:#d4cfc4;--border2:#e8e4dc;--red:#c8392b;--red2:#a52d21;--redl:#fdecea;--redxl:#fff8f7;--gold:#c07d2a;--goldl:#fdf3e0;--goldb:#f5d08a;--green:#1a6640;--greenl:#e6f4ed;--blue:#1a3a8f;--bluel:#e6ecf8;--muted:#7a7568;--muted2:#a8a398;--sh:0 2px 8px rgba(15,17,23,.08),0 1px 3px rgba(15,17,23,.05);--sh2:0 8px 24px rgba(15,17,23,.12);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--paper);color:var(--ink);font-family:"Outfit",sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}
.hdr{background:var(--ink);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr-brand{display:flex;align-items:center;gap:10px;}
.hdr-dot{width:8px;height:8px;background:var(--red);border-radius:50%;}
.hdr-name{font-family:"Syne",sans-serif;font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px;}
.hdr-sub{font-size:10px;color:#6b7280;letter-spacing:2px;text-transform:uppercase;margin-left:4px;}
.hdr-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#6b7280;background:rgba(255,255,255,.06);padding:4px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.08);}
.scr{display:none;}.scr.on{display:block;animation:up .22s ease;}
@keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;}
.spin{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
.load-t{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.search-pg{max-width:520px;margin:0 auto;padding:40px 20px 60px;}
.search-eyebrow{font-size:10px;font-weight:600;color:var(--red);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.search-title{font-family:"Syne",sans-serif;font-size:32px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:12px;}
.search-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.meta-chip{font-size:11px;color:var(--muted);background:var(--paper2);border:1px solid var(--border2);padding:3px 10px;border-radius:20px;}
.search-box{display:flex;background:#fff;border:2px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--sh);margin-bottom:6px;transition:border-color .15s;}
.search-box:focus-within{border-color:var(--red);}
.s-inp{flex:1;border:none;outline:none;padding:13px 16px;font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--ink);background:transparent;}
.s-inp::placeholder{color:var(--muted2);font-size:13px;font-family:"Outfit",sans-serif;}
.s-btn{background:var(--red);color:#fff;border:none;cursor:pointer;padding:12px 22px;font-family:"Syne",sans-serif;font-weight:700;font-size:13px;transition:background .15s;white-space:nowrap;}
.s-btn:active{background:var(--red2);}
.s-err{font-size:12px;color:var(--red);padding:2px 4px 8px;}
.dd{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:var(--sh2);margin-top:4px;}
.dd-row{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;transition:background .1s;}
.dd-row:last-child{border-bottom:none;}
.dd-row:hover,.dd-row:active{background:var(--redxl);}
.dd-fos{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--ink);}
.dd-info{font-size:11px;color:var(--muted);}
.dash{max-width:720px;margin:0 auto;padding:16px 16px 48px;}
.topbar{background:var(--ink);border-radius:10px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.tb-fos{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:500;color:#fff;}
.tb-name{font-size:12px;color:#9ca3af;margin-top:2px;}
.tb-meta{font-size:11px;color:#6b7280;margin-top:1px;}
.tb-asc{background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.3);border-radius:8px;padding:8px 14px;text-align:center;}
.tb-asc-lbl{font-size:9px;font-weight:700;color:#a78bfa;text-transform:uppercase;letter-spacing:.8px;}
.tb-asc-val{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;color:#c4b5fd;}
.tb-asc-sub{font-size:10px;color:#a78bfa;margin-top:1px;}
.back-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#d1d5db;cursor:pointer;padding:8px 14px;border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap;}
.back-btn:active{background:rgba(255,255,255,.15);}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.al{display:flex;gap:10px;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.5;align-items:flex-start;}
.al-ico{font-size:14px;flex-shrink:0;margin-top:1px;}
.al-r{background:var(--redxl);border:1px solid #fca5a5;color:#7f1d1d;}
.al-g{background:var(--goldl);border:1px solid var(--goldb);color:#713f12;}
.al-c75{background:linear-gradient(135deg,#fffbeb,#fef9c3);border:2px solid #fcd34d;color:#713f12;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
@media(max-width:500px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;}
.kpi.kr::before{background:var(--red);}.kpi.kg::before{background:var(--gold);}.kpi.kgr::before{background:var(--green);}.kpi.kb::before{background:var(--blue);}.kpi.kp::before{background:#7c3aed;}.kpi.ki::before{background:var(--ink);}
.kpi-lbl{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.kpi-val{font-family:"Syne",sans-serif;font-size:22px;font-weight:800;color:var(--ink);line-height:1;}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.sec{margin-bottom:12px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.sec-t{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
.pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.pr{background:var(--redl);color:var(--red2);}.pg{background:var(--goldl);color:var(--gold);}.pgr{background:var(--greenl);color:var(--green);}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--sh);}
.card-hdr{padding:10px 14px;border-bottom:1px solid var(--border2);background:var(--paper2);display:flex;align-items:center;justify-content:space-between;gap:6px;}
.card-t{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--border2);transition:background .1s;}
.vrow:last-child{border-bottom:none;}
.vrow.c75nv{background:linear-gradient(90deg,#fff7ed,#fff);border-left:3px solid #fb923c;}
.vrow.c75win{background:linear-gradient(90deg,#fffbeb,#fff);border-left:3px solid #fcd34d;}
.vnum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-size:11px;font-weight:800;flex-shrink:0;margin-top:2px;}
.vn1{background:var(--red);color:#fff;}.vn2{background:var(--ink3);color:#fff;}.vn3{background:var(--gold);color:#fff;}.vnn{background:var(--paper2);color:var(--muted);border:1px solid var(--border);}
.vbody{flex:1;min-width:0;}
.vret{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--red);font-weight:500;}
.vnm{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.vact{font-size:13px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.3;}
.vwhy{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
.vtag{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.3px;}
.tg-c75nv{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5;}
.tg-c75{background:#fef9c3;color:#713f12;border:1px solid #fde047;}
.tg-drop{background:var(--redl);color:var(--red2);}
.tg-dorm{background:var(--goldl);color:var(--gold);}
.tg-top{background:var(--greenl);color:var(--green);}
.tg-sso{background:var(--bluel);color:var(--blue);}
.tg-wifi{background:#fff7ed;color:#c2410c;}
.tg-asc{background:#ede9fe;color:#6d28d9;}
.tg-in{background:var(--paper2);color:var(--muted);}
.vright{text-align:right;flex-shrink:0;}
.vval{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;color:var(--green);}
.vlbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-dot"></div><span class="hdr-name">FOS INTELLIGENCE</span><span class="hdr-sub">ASC Workways</span></div>
  <div class="hdr-tag" id="hdrDate"></div>
</div>

<div class="scr on" id="s-load">
  <div class="loading"><div class="spin"></div><div class="load-t" id="loadMsg">Connecting…</div></div>
</div>

<div class="scr" id="s-search">
  <div class="search-pg">
    <div class="search-eyebrow">Field Officer Analytics</div>
    <div class="search-title">Today's Visit<br>Intelligence</div>
    <div class="search-meta" id="metaChips"><span class="meta-chip">⏳ Loading…</span></div>
    <div class="search-box">
      <input class="s-inp" id="sInp" type="tel" placeholder="FOS number…"
        oninput="onType(this.value)" onkeydown="if(event.key==='Enter')goView()">
      <button class="s-btn" onclick="goView()">View →</button>
    </div>
    <div class="s-err" id="sErr"></div>
    <div class="dd" id="sDD" style="display:none"></div>
  </div>
</div>

<div class="scr" id="s-dash"><div class="dash" id="dc"></div></div>

<script>
const RS = '\u20b9';
const FM = v => v > 999 ? RS + (v/1000).toFixed(0) + 'k' : String(Math.round(v));
const show = id => { document.querySelectorAll('.scr').forEach(s => s.classList.remove('on')); document.getElementById(id).classList.add('on'); };
const N = v => isNaN(+v) ? 0 : +v;

document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('en-IN', {weekday:'short',day:'2-digit',month:'short',year:'numeric'});

// ── Column layout (mirrors server.py build_row) ────────────────────────
// Each outlet = array:
// [0] ret, [1] name, [2] tag(0=GT,1=ASC), [3] gtTag(0=Club75,1=Others,2=Drop,3=Dormant)
// [4–10]  g0–g6  Gross SEP25–MAR26
// [11]    g7     MTD gross APR26 (current)
// [12–18] t0–t6  Tertiary SEP25–MAR26
// [19–25] w0–w6  Wifi SEP25–MAR26
// [26–32] s0–s6  SSO
// [33–36] b3–b6  Sim bill Dec25–Mar26
// [37]    b7     MTD sim bill APR
// [38–41] x3–x6  Sim swap Dec25–Mar26
// [42]    x7     MTD sim swap APR

function expand(meta, rows) {
  const GT = ['Club 75','OTHERS','Drop','Dormant',''];
  return rows.map(r => ({
    r: r[0], n: r[1],
    tag:   r[2] === 1 ? 'ASC' : 'GT',
    gtTag: GT[r[3]] || '',
    tm: meta.tm, zn: meta.zn, zm: meta.zm,
    g0:r[4], g1:r[5], g2:r[6], g3:r[7], g4:r[8], g5:r[9], g6:r[10], g7:r[11],
    t0:r[12],t1:r[13],t2:r[14],t3:r[15],t4:r[16],t5:r[17],t6:r[18],
    w0:r[19],w1:r[20],w2:r[21],w3:r[22],w4:r[23],w5:r[24],w6:r[25],
    s0:r[26],s1:r[27],s2:r[28],s3:r[29],s4:r[30],s5:r[31],s6:r[32],
    b3:r[33],b4:r[34],b5:r[35],b6:r[36],b7:r[37],
    x3:r[38],x4:r[39],x5:r[40],x6:r[41],x7:r[42],
  }));
}

const G   = (r,i) => N(r['g'+i]);
const T   = (r,i) => N(r['t'+i]);
const W   = (r,i) => N(r['w'+i]);
const SB  = (r,i) => N(r['b'+i]);
const SS  = (r,i) => N(r['x'+i]);
const SSO = (r,i) => N(r['s'+i]);

// ── FOS index (search) ────────────────────────────────────────────────
let IDX = [];

fetch('/api/fos-list')
  .then(r => r.json())
  .then(list => {
    IDX = list;
    const total = IDX.reduce((s, f) => s + f.count, 0);
    document.getElementById('metaChips').innerHTML =
      `<span class="meta-chip">📍 ${total.toLocaleString()} outlets</span>
       <span class="meta-chip">👤 ${IDX.length} FOS officers</span>`;
    show('s-search');
  })
  .catch(e => { document.getElementById('loadMsg').textContent = '⚠ Cannot reach server: ' + e.message; });

function onType(v) {
  const dd = document.getElementById('sDD');
  document.getElementById('sErr').textContent = '';
  if (!v || v.length < 2) { dd.style.display = 'none'; return; }
  const hits = IDX.filter(f => f.fos.includes(v)).slice(0, 8);
  if (!hits.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = hits.map(f =>
    `<div class="dd-row" onclick="pick('${f.fos}')">
      <div><div class="dd-fos">${f.fos}</div>
      <div class="dd-info">${f.tm} · ${f.zm} · ${f.count} outlets</div></div>
    </div>`
  ).join('');
  dd.style.display = 'block';
}

function pick(f) { document.getElementById('sInp').value = f; document.getElementById('sDD').style.display = 'none'; goView(); }

function goView() {
  const v = document.getElementById('sInp').value.trim();
  if (!v) { document.getElementById('sErr').textContent = 'Enter a FOS number'; return; }
  document.getElementById('sErr').textContent = '';
  document.getElementById('sDD').style.display = 'none';
  show('s-load');
  document.getElementById('loadMsg').textContent = 'Fetching data…';

  fetch(`/api/fos/${encodeURIComponent(v)}`)
    .then(r => { if (!r.ok) throw new Error(r.status === 404 ? `FOS ${v} not found` : 'Server error'); return r.json(); })
    .then(data => { show('s-dash'); renderDash(data.meta, expand(data.meta, data.outlets)); })
    .catch(e => { show('s-search'); document.getElementById('sErr').textContent = '⚠ ' + e.message; });
}

// ── DASHBOARD ─────────────────────────────────────────────────────────
function renderDash(meta, outlets) {
  const dom = new Date().getDate();
  const isWin = (dom >= 29 || dom <= 4);

  outlets.forEach(r => {
    r._asc = r.tag === 'ASC'; r._gt = !r._asc;
    r._c75 = r._gt && r.gtTag === 'Club 75';
    r._gc  = G(r,7);  // APR MTD — current
    r._gp  = G(r,6);  // MAR — previous
    r._gav = ([4,5,6].reduce((s,i) => s + G(r,i), 0)) / 3;
    r._tc  = T(r,6);
    r._tt  = [0,1,2,3,4,5,6].reduce((s,i) => s + T(r,i), 0);
    r._wc  = W(r,6);
    r._bf  = SB(r,6); // MAR bill
    r._bm  = SB(r,7); // APR MTD bill
    r._bl2 = r._bf + r._bm;
    r._sb  = SB(r,7);
    r._ss  = SS(r,7);
    r._bAny = (SB(r,5) > 0 || r._bf > 0 || r._bm > 0);
    r._sso = [4,5,6].some(i => SSO(r,i) >= 1);
    r._drop = r._gp > 0 ? (r._gc - r._gp) / r._gp : 0;
    r._dorm = r._gc === 0 && r._gp === 0 && r._tt > 0;
    r._nv  = r._c75 && r._bl2 < 10;
  });

  const gt      = outlets.filter(r => r._gt);
  const asc     = outlets.filter(r => r._asc);
  const c75     = gt.filter(r => r._c75).sort((a,b) => b._gc - a._gc);
  const c75nv   = c75.filter(r => r._nv).sort((a,b) => a._bl2 - b._bl2);
  const drops   = gt.filter(r => r._drop < -0.25 && r._gp >= 5).sort((a,b) => a._drop - b._drop);
  const dormHT  = gt.filter(r => r._dorm && r._tt > 1000).sort((a,b) => b._tt - a._tt);
  const topOL   = gt.filter(r => r._gc >= r._gav * 1.1 && r._gc > 0).sort((a,b) => b._gc - a._gc);
  const ssoOL   = gt.filter(r => r._sso).sort((a,b) => b._gc - a._gc);
  const wifiOpp = gt.filter(r => r._wc === 0 && r._tt > 5000).sort((a,b) => b._tt - a._tt);
  const unbilled = gt.filter(r => !r._bAny);

  const totG  = gt.reduce((s,r) => s + r._gc, 0);
  const totT  = gt.reduce((s,r) => s + r._tc, 0);
  const totSS = outlets.reduce((s,r) => s + r._ss, 0);
  const totW  = outlets.reduce((s,r) => s + r._wc, 0);
  const ascG  = asc.reduce((s,r) => s + r._gc, 0);
  const ascGp = asc.reduce((s,r) => s + r._gp, 0);
  const ascDrop = ascGp > 0 ? (ascG - ascGp) / ascGp : null;
  const actOL = gt.filter(r => r._gc > 0).length;

  // Top 10 tasks
  const tasks = []; const used = new Set();
  const add = (r,a,w,cat,m,ml) => { if (used.has(r.r) || tasks.length >= 10) return; used.add(r.r); tasks.push({ret:r.r,name:r.n,a,w,cat,m,ml}); };

  c75nv.slice(0, isWin ? 5 : 4).forEach(r => add(r,
    `Club 75 NOT VISITED — only ${r._bl2} billed`,
    `Min 10 required. Mar: ${r._bf} + Apr MTD: ${r._bm}. Visit immediately.`,
    'c75nv', r._bl2, 'billed L2M'));
  if (isWin) c75.filter(r => !r._nv).slice(0, 3).forEach(r => add(r,
    `Club 75 priority window visit`,
    `${r._gc} sims Apr MTD. Collect orders, lock targets.`,
    'c75win', r._gc, 'APR MTD'));
  drops.slice(0, 3).forEach(r => add(r,
    `Gross drop — ${Math.abs(Math.round(r._drop * 100))}% vs last month`,
    `Was ${r._gp} (Mar) → now ${r._gc} Apr MTD. Investigate & recover.`,
    'drop', r._gc, 'APR MTD'));
  dormHT.slice(0, 2).forEach(r => add(r,
    `Reactivate — zero gross, high tertiary`,
    `${RS}${(r._tt/1000).toFixed(0)}k tertiary but not selling.`,
    'dorm', r._tt, 'tert'));
  ssoOL.filter(r => r._gc < 2).slice(0, 2).forEach(r => add(r,
    `SSO not selling — push SIM`,
    `Only ${r._gc} Apr MTD gross. Retrain & incentivise.`,
    'sso', r._sb, 'billed'));
  topOL.slice(0, 2).forEach(r => add(r,
    `Maintain top performer`,
    `${r._gc} sims Apr MTD, above avg ${r._gav.toFixed(0)}.`,
    'top', r._gc, 'APR MTD'));
  wifiOpp.slice(0, 1).forEach(r => add(r,
    `Wifi upsell — zero bookings`,
    `${RS}${(r._tt/1000).toFixed(0)}k tertiary. Easy win.`,
    'wifi', r._tt, 'tert'));
  unbilled.slice(0, 1).forEach(r => add(r,
    `Unbilled 3 months — push activation`,
    `Zero billing Feb–Apr. Needs push.`,
    'drop', r._gc, 'APR MTD'));
  gt.sort((a,b) => b._tt - a._tt).forEach(r => {
    if (tasks.length >= 10) return;
    add(r, `High-value — regular visit`, `${RS}${(r._tt/1000).toFixed(0)}k tertiary.`, 'top', r._tt, 'tert');
  });

  const TAGS = {
    c75nv:  '<span class="vtag tg-c75nv">⚠ CLUB75 NOT VIS</span>',
    c75win: '<span class="vtag tg-c75">🏆 CLUB 75</span>',
    drop:   '<span class="vtag tg-drop">GROSS DROP</span>',
    dorm:   '<span class="vtag tg-dorm">DORMANT</span>',
    top:    '<span class="vtag tg-top">TOP</span>',
    sso:    '<span class="vtag tg-sso">SSO</span>',
    wifi:   '<span class="vtag tg-wifi">WIFI OPP</span>',
  };
  const RNK = i => i===0?'vn1':i===1?'vn2':i===2?'vn3':'vnn';
  const TREND = r => r._drop > 0.08 ? `<span style="color:var(--green);font-weight:600">↑${Math.round(r._drop*100)}%</span>` :
    r._drop < -0.08 ? `<span style="color:var(--red);font-weight:600">↓${Math.abs(Math.round(r._drop*100))}%</span>` : '—';

  const alerts = [];
  if (isWin && c75.length > 0)
    alerts.push(`<div class="al al-c75"><div class="al-ico">🏆</div><div><strong>Club 75 Priority Window active (29th–4th)</strong> — visit all ${c75.length} Club 75 outlets first.${c75nv.length > 0 ? ` ⚠ ${c75nv.length} not visited yet.` : ' All visited ✓'}</div></div>`);
  if (c75nv.length > 0)
    alerts.push(`<div class="al al-r"><div class="al-ico">⚠️</div><div><strong>${c75nv.length} Club 75 outlet${c75nv.length>1?'s':''} not visited</strong> — less than 10 sims billed Mar+Apr. Immediate action.</div></div>`);
  if (drops.length > 0)
    alerts.push(`<div class="al al-r"><div class="al-ico">📉</div><div><strong>${drops.length} outlet${drops.length>1?'s':''} with gross drop >25%</strong> (Apr MTD vs Mar)</div></div>`);
  if (ascDrop !== null && ascDrop < -0.2)
    alerts.push(`<div class="al al-r"><div class="al-ico">⚡</div><div><strong>ASC self gross down ${Math.abs(Math.round(ascDrop*100))}%</strong> — was ${ascGp} (Mar), now ${ascG} Apr MTD</div></div>`);
  if (unbilled.length > 0)
    alerts.push(`<div class="al al-g"><div class="al-ico">🧾</div><div><strong>${unbilled.length} retailers</strong> with zero SIM billing Feb–Apr</div></div>`);

  const ascTrend = ascDrop !== null ? (ascDrop >= 0
    ? `<span style="color:#a78bfa;font-size:11px">↑${Math.round(ascDrop*100)}%</span>`
    : `<span style="color:#f87171;font-size:11px">↓${Math.abs(Math.round(ascDrop*100))}%</span>`) : '';

  document.getElementById('dc').innerHTML = `
  <div class="topbar">
    <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div>
        <div class="tb-fos">${meta.fos}</div>
        <div class="tb-name">${meta.tm}</div>
        <div class="tb-meta">${meta.zm} · ${meta.zn} · ${outlets.length} outlets (${asc.length} ASC · ${gt.length} GT)</div>
      </div>
      ${asc.length > 0 ? `<div class="tb-asc">
        <div class="tb-asc-lbl">ASC Self Gross APR</div>
        <div class="tb-asc-val">${ascG} <span style="font-size:12px;font-weight:400">MTD</span></div>
        <div class="tb-asc-sub">${asc.length} outlet${asc.length>1?'s':''} ${ascTrend}</div>
      </div>` : ''}
    </div>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>

  ${alerts.length ? `<div class="alerts">${alerts.join('')}</div>` : ''}

  <div class="kpis">
    <div class="kpi kg"><div class="kpi-lbl">Club 75</div><div class="kpi-val" style="color:var(--gold)">${c75.length}</div>
      <div class="kpi-sub" style="color:${c75nv.length > 0 ? 'var(--red)' : 'var(--green)'}">${c75nv.length > 0 ? c75nv.length + ' not visited' : 'All visited ✓'}</div></div>
    <div class="kpi kr"><div class="kpi-lbl">GT Gross APR MTD</div><div class="kpi-val">${totG}</div><div class="kpi-sub">${actOL}/${gt.length} active</div></div>
    <div class="kpi kgr"><div class="kpi-lbl">Tertiary MAR</div><div class="kpi-val" style="font-size:18px">${RS}${(totT/1000).toFixed(0)}k</div><div class="kpi-sub">latest available</div></div>
    <div class="kpi kr"><div class="kpi-lbl">Gross Drops</div><div class="kpi-val" style="color:var(--red)">${drops.length}</div><div class="kpi-sub">APR vs MAR</div></div>
    <div class="kpi kb"><div class="kpi-lbl">Sim Swaps APR</div><div class="kpi-val">${totSS}</div><div class="kpi-sub">MTD</div></div>
    <div class="kpi ki"><div class="kpi-lbl">Wifi MAR</div><div class="kpi-val">${totW}</div><div class="kpi-sub">latest available</div></div>
    <div class="kpi kr"><div class="kpi-lbl">Unbilled Feb–Apr</div><div class="kpi-val" style="color:var(--red)">${unbilled.length}</div><div class="kpi-sub">retailers</div></div>
    <div class="kpi kp"><div class="kpi-lbl">SSO Outlets</div><div class="kpi-val">${ssoOL.length}</div><div class="kpi-sub">active</div></div>
  </div>

  <div class="sec">
    <div class="sec-hdr">
      <div class="sec-t">🎯 Today's Visit Plan</div>
      <div style="display:flex;gap:5px">
        <span class="pill pr">Top 10</span>
        ${isWin ? '<span class="pill pg">🏆 Club 75 Window</span>' : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-t">Priority-ranked outlet visits · Apr MTD analysis</div></div>
      ${tasks.map((t,i) => `
      <div class="vrow ${t.cat==='c75nv'?'c75nv':t.cat==='c75win'?'c75win':''}">
        <div class="vnum ${RNK(i)}">${i+1}</div>
        <div class="vbody">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="vret">${t.ret}</span>
            <span class="vnm">${t.name}</span>
          </div>
          <div class="vact">${t.a}</div>
          <div class="vwhy">${t.w}</div>
          ${TAGS[t.cat] || ''}
        </div>
        <div class="vright">
          <div class="vval">${FM(t.m)}</div>
          <div class="vlbl">${t.ml}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function goBack() {
  show('s-search');
  document.getElementById('dc').innerHTML = '';
  document.getElementById('sInp').value = '';
  document.getElementById('sDD').style.display = 'none';
  document.getElementById('sErr').textContent = '';
}
</script>
</body>
</html>
